# Deploys momoblobs.com on every push to main (and on demand from the Actions tab): checks the changed code, then runs
# the same `npm run deploy` as on a laptop — build with the hosting-budget and mobile-performance checks, upload only
# new or changed game files to R2, publish the Worker. No laptop, no `wrangler login`.
#
# One-time setup (repository → Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN — a token from the MOMOBLOBS Cloudflare account (My Profile → API Tokens → Create Token →
#   template "Edit Cloudflare Workers", plus Account → "Workers R2 Storage: Edit"). The account itself is pinned in
#   wrangler.jsonc. Without the secret, the checks still run and the deploy step is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-momoblobs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next's build cache and TypeScript's incremental data, kept between runs (only what changed is redone)
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint the changed files
        env:
          BASE: ${{ github.event.before }}
        run: npm run lint:changed

      - name: No Cloudflare token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Deploy skipped — add the CLOUDFLARE_API_TOKEN repository secret to deploy automatically (see the top of this file)."

      - name: Deploy (build + checks, R2 upload, Worker)
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
